x-laravel-env: &laravel-env
  DB_CONNECTION: pgsql
  DB_HOST: postgres
  DB_PORT: 5432
  DB_DATABASE: bookly
  DB_USERNAME: postgres
  DB_PASSWORD: postgres
  # Booking events reach the realtime service as signed webhooks.
  WEBHOOK_ENDPOINTS: http://realtime:3000/webhooks/bookly
  WEBHOOK_SECRET: &webhook-secret local-dev-webhook-secret

services:
  app:
    build: docker/php
    # First run: creates .env and an app key, so `docker compose up` is all a fresh clone needs.
    # --no-reload: otherwise `serve` hides this container's environment (DB_HOST=postgres...)
    # from the web server whenever PHP fills $_ENV, as the official images do (no php.ini).
    command: >-
      sh -c "([ -f .env ] || cp .env.example .env)
      && composer install
      && (grep -q '^APP_KEY=.' .env || php artisan key:generate --force)
      && php artisan migrate --force
      && php artisan db:seed --force
      && php artisan serve --host=0.0.0.0 --port=8000 --no-reload"
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment: *laravel-env
    depends_on:
      postgres:
        condition: service_healthy

  # Delivers domain events from the outbox as soon as they are committed.
  relay:
    build: docker/php
    command: php artisan outbox:relay --watch
    restart: unless-stopped # until the app container has installed and migrated
    volumes:
      - .:/app
    environment: *laravel-env
    depends_on:
      - app

  realtime:
    image: node:22-alpine
    working_dir: /app/realtime
    command: sh -c "npm ci && npm run build && npm start"
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    environment:
      API_URL: http://app:8000
      WEBHOOK_SECRET: *webhook-secret

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
    environment:
      API_URL: http://app:8000
      REALTIME_URL: http://realtime:3000
    depends_on:
      - app
      - realtime

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bookly
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  pgdata:
