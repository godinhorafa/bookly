name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, intl
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Pint
        run: vendor/bin/pint --test

      - name: Rector
        run: vendor/bin/rector --dry-run

      - name: PHPStan (level max)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

  tests:
    name: Tests (PostgreSQL 16)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          # Throwaway container reachable only from this job: no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: bookly_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, intl
          coverage: pcov

      - uses: ramsey/composer-install@v4

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: OpenAPI spec is up to date
        # Scramble reads the database schema to describe models, so migrate first.
        env:
          DB_DATABASE: bookly_test
        run: |
          php artisan migrate --force
          php artisan scramble:export --path=docs/api/openapi.json
          git diff --exit-code docs/api/openapi.json || (echo "Run: php artisan scramble:export --path=docs/api/openapi.json" && exit 1)

      - name: Unit & architecture tests
        run: vendor/bin/pest --testsuite=Unit,Arch

      - name: Integration & feature tests
        run: vendor/bin/pest --testsuite=Integration,Feature
        env:
          # Optional: when set, the payment gateway contract also runs against Stripe test mode.
          STRIPE_TEST_SECRET: ${{ secrets.STRIPE_TEST_SECRET }}

      - name: Concurrency tests (parallel processes)
        run: vendor/bin/pest --testsuite=Concurrency

      - name: Coverage
        run: vendor/bin/pest --coverage

  frontend:
    name: Frontend (types, unit tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: API types match the OpenAPI spec
        run: |
          npm run api:types
          git diff --exit-code src/api/schema.d.ts || (echo "Run: npm run api:types" && exit 1)

      - name: Type check
        run: npm run typecheck

      - name: Unit & component tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    name: End-to-end (Playwright, real API + PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          # Throwaway container reachable only from this job: no password needed.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: bookly_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, intl
          coverage: none

      - uses: ramsey/composer-install@v4

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dashboard dependencies
        working-directory: frontend
        run: npm ci

      - name: Resolve Playwright version
        id: playwright
        working-directory: frontend
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      # The browser download is cached per Playwright version; system libraries
      # come from apt every run, non-interactively so no package can wait for input.
      - name: Cache Playwright browsers
        id: browser-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        if: steps.browser-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        timeout-minutes: 10
        run: npx playwright install chromium

      - name: Install Chromium system dependencies
        working-directory: frontend
        timeout-minutes: 12
        env:
          DEBIAN_FRONTEND: noninteractive
        run: npx playwright install-deps chromium

      - name: Run the customer journey
        working-directory: frontend
        run: npx playwright test

      - name: Keep the report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
