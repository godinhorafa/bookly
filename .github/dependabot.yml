version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      frontend:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/realtime"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      realtime:
        patterns:
          - "*"
