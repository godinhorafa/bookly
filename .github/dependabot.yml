version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    ignore:
      # Node types follow the Node.js runtime (22), not the latest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # openapi-typescript does not support TypeScript 7 yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      frontend:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/realtime"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    ignore:
      # Node types follow the Node.js runtime (22), not the latest release.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Kept on the same TypeScript as the dashboard.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      realtime:
        patterns:
          - "*"
